name: cha-os ISO

on:
  workflow_dispatch:

jobs:
  build-iso:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: free disk
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost 2>/dev/null || true
          docker system prune -af 2>/dev/null || true
          df -h
      - name: build ISO in privileged arch
        run: |
          docker run --privileged --rm \
            -v $GITHUB_WORKSPACE:/workspace -w /workspace \
            archlinux:latest bash repo-tools/ci-build-iso.sh
      - name: checksum
        run: cd out && sha256sum *.iso > SHA256SUMS && cat SHA256SUMS
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: cha-os-iso
          path: out/*
