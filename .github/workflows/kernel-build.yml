name: cha-kernel build

on:
  workflow_dispatch:
    inputs:
      variant:
        description: 'desktop/v3/lowend'
        default: 'desktop'

jobs:
  build-x86_64:
    runs-on: ubuntu-24.04
    container: archlinux:latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
      - name: deps
        run: |
          pacman -Syu --noconfirm --needed base-devel bc cpio gettext libelf pahole perl python tar xz zstd git clang llvm ccache rsync openssl flex bison kmod mkinitcpio
          sed -i 's/ debug/ !debug/' /etc/makepkg.conf
          grep -q MAKEFLAGS /etc/makepkg.conf || echo 'MAKEFLAGS="-j2"' >> /etc/makepkg.conf
      - name: preflight (30 saniyede paketleme araclari denetimi)
        run: |
          for t in rsync openssl pahole flex bison bc cpio depmod python3 gcc make; do command -v $t >/dev/null || { echo "EKSIK: $t"; exit 1; }; done
          echo "preflight OK"
      - name: ccache
        uses: actions/cache@v4
        with:
          path: /root/.cache/ccache
          key: cha-ccache-${{ inputs.variant || 'desktop' }}
      - name: build
        working-directory: cha-kernel
        run: |
          id builder 2>/dev/null || useradd -m builder
          chown -R builder:builder .
          export CHA_VARIANT="${{ inputs.variant || 'desktop' }}"
          runuser -u builder -- bash -c 'export MAKEFLAGS="-j2"; export CC="ccache gcc"; export CXX="ccache g++"; makepkg --noconfirm -s --skippgpcheck --nocheck'
      - name: upload
        uses: actions/upload-artifact@v4
        with:
          name: cha-kernel-${{ inputs.variant || 'desktop' }}
          path: cha-kernel/*.pkg.tar.zst
  # ARM portu Faz1 karariyla kapali.
