# CHA performance sysctl - /usr/lib/sysctl.d/99-cha-performance.conf
# Gerekce: zram var, o yuzden swappiness YUKSEK. eMMC/HDD'de dirty dusuk tutulur.

# zram ile takas ucuz -> erken takasla RAM bosalt, OOM killer yeme
vm.swappiness = 180
# cache'i agresif atma (derleme/uygulama tekrar acilista hizli)
vm.vfs_cache_pressure = 50
# Kirli sayfa: eMMC/HDD'de ani yigilmayi onle
vm.dirty_background_ratio = 5
vm.dirty_ratio = 15
vm.dirty_expire_centisecs = 3000
vm.dirty_writeback_centisecs = 500
# OOM'a giden yolda erken mudahale
vm.watermark_boost_factor = 0
vm.watermark_scale_factor = 125
# Dosya izleme limiti (VSCode/IDE + file manager icin)
fs.inotify.max_user_watches = 524288
# Scheduler gecikme: 2-4 cekirdekte interaktivite
kernel.sched_min_granularity_ns = 3000000
kernel.sched_wakeup_granularity_ns = 2000000
kernel.sched_migration_cost_ns = 500000
# Bellek asiri commit'e izin verme (dusuk RAM'de patlamayi onle)
vm.overcommit_memory = 0
vm.overcommit_ratio = 50
