# CHA pacman.conf - /etc/pacman.conf yerine gecer (archiso pacman.conf)
[options]
HoldPkg = pacman glibc
Architecture = x86_64
Color
CheckSpace
VerbosePkgLists
ParallelDownloads = 5
DownloadUser = alpm
DisableDownloadTimeout
ILoveCandy
SigLevel = Required DatabaseOptional
LocalFileSigLevel = Optional

[core]
Include = /etc/pacman.d/mirrorlist
[extra]
Include = /etc/pacman.d/mirrorlist
# cha-repo EN USTTE degil EN ALTTA olmali (core/extra ezmesin, sadece cha-* saglasin)
[cha-repo]
SigLevel = Required DatabaseOptional
Server = https://repo.cha-os.local/$arch
# GPG: pacman-key --add cha-repo.pub && pacman-key --lsign-key repo@cha-os.local
