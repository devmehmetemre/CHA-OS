<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <!-- Arka plan gradyanı -->
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#060910"/>
      <stop offset="45%"  stop-color="#0a0f1e"/>
      <stop offset="100%" stop-color="#050810"/>
    </linearGradient>

    <!-- Logo parlama -->
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="30%">
      <stop offset="0%"   stop-color="#1a3a6e" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#060910" stop-opacity="0"/>
    </radialGradient>

    <!-- Izgara çizgi filtresi -->
    <filter id="gridBlur">
      <feGaussianBlur stdDeviation="0.5"/>
    </filter>

    <!-- Logo parlama filtresi -->
    <filter id="logoGlow">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Yıldız parlaması -->
    <filter id="starGlow">
      <feGaussianBlur stdDeviation="1.5"/>
    </filter>
  </defs>

  <!-- Ana arka plan -->
  <rect width="1920" height="1080" fill="url(#skyGrad)"/>

  <!-- Merkez aydınlatma -->
  <ellipse cx="960" cy="490" rx="560" ry="340" fill="url(#centerGlow)"/>

  <!-- ─── Perspektif ızgara (zemin) ─────────────────────── -->
  <g opacity="0.07" filter="url(#gridBlur)">
    <!-- Yatay çizgiler (perspektifli) -->
    <line x1="0"    y1="780" x2="1920" y2="780" stroke="#4a9eff" stroke-width="0.6"/>
    <line x1="0"    y1="820" x2="1920" y2="820" stroke="#4a9eff" stroke-width="0.6"/>
    <line x1="0"    y1="870" x2="1920" y2="870" stroke="#4a9eff" stroke-width="0.6"/>
    <line x1="0"    y1="930" x2="1920" y2="930" stroke="#4a9eff" stroke-width="0.6"/>
    <line x1="0"    y1="1000" x2="1920" y2="1000" stroke="#4a9eff" stroke-width="0.6"/>
    <line x1="0"    y1="1080" x2="1920" y2="1080" stroke="#4a9eff" stroke-width="0.6"/>

    <!-- Dikey çizgiler (perspektifli — kaçış noktasına) -->
    <line x1="960" y1="630" x2="0"    y2="1080" stroke="#4a9eff" stroke-width="0.6"/>
    <line x1="960" y1="630" x2="192"  y2="1080" stroke="#4a9eff" stroke-width="0.6"/>
    <line x1="960" y1="630" x2="384"  y2="1080" stroke="#4a9eff" stroke-width="0.6"/>
    <line x1="960" y1="630" x2="576"  y2="1080" stroke="#4a9eff" stroke-width="0.6"/>
    <line x1="960" y1="630" x2="768"  y2="1080" stroke="#4a9eff" stroke-width="0.6"/>
    <line x1="960" y1="630" x2="960"  y2="1080" stroke="#4a9eff" stroke-width="0.6"/>
    <line x1="960" y1="630" x2="1152" y2="1080" stroke="#4a9eff" stroke-width="0.6"/>
    <line x1="960" y1="630" x2="1344" y2="1080" stroke="#4a9eff" stroke-width="0.6"/>
    <line x1="960" y1="630" x2="1536" y2="1080" stroke="#4a9eff" stroke-width="0.6"/>
    <line x1="960" y1="630" x2="1728" y2="1080" stroke="#4a9eff" stroke-width="0.6"/>
    <line x1="960" y1="630" x2="1920" y2="1080" stroke="#4a9eff" stroke-width="0.6"/>
  </g>

  <!-- ─── Yatay ufuk çizgisi ──────────────────────────────── -->
  <line x1="0" y1="630" x2="1920" y2="630"
        stroke="#4a9eff" stroke-width="1.5" opacity="0.18"/>

  <!-- ─── Ufuk üstü ince yatay çizgiler ─────────────────── -->
  <g opacity="0.05">
    <line x1="0" y1="540" x2="1920" y2="540" stroke="#4a9eff" stroke-width="0.5"/>
    <line x1="0" y1="460" x2="1920" y2="460" stroke="#4a9eff" stroke-width="0.5"/>
    <line x1="0" y1="390" x2="1920" y2="390" stroke="#4a9eff" stroke-width="0.5"/>
  </g>

  <!-- ─── Yıldızlar ───────────────────────────────────────── -->
  <g fill="#ffffff">
    <!-- Büyük yıldızlar -->
    <circle cx="120"  cy="80"  r="1.4" opacity="0.9"/>
    <circle cx="380"  cy="140" r="1.2" opacity="0.8"/>
    <circle cx="650"  cy="55"  r="1.6" opacity="0.9"/>
    <circle cx="890"  cy="110" r="1.1" opacity="0.7"/>
    <circle cx="1100" cy="70"  r="1.5" opacity="0.85"/>
    <circle cx="1350" cy="130" r="1.3" opacity="0.8"/>
    <circle cx="1600" cy="60"  r="1.4" opacity="0.9"/>
    <circle cx="1820" cy="95"  r="1.2" opacity="0.75"/>
    <circle cx="260"  cy="200" r="1.0" opacity="0.6"/>
    <circle cx="510"  cy="250" r="1.1" opacity="0.7"/>
    <circle cx="760"  cy="180" r="0.9" opacity="0.65"/>
    <circle cx="1020" cy="210" r="1.2" opacity="0.72"/>
    <circle cx="1240" cy="170" r="1.0" opacity="0.68"/>
    <circle cx="1480" cy="220" r="1.1" opacity="0.74"/>
    <circle cx="1720" cy="195" r="0.9" opacity="0.62"/>

    <!-- Küçük yıldızlar -->
    <circle cx="45"   cy="150" r="0.7" opacity="0.55"/>
    <circle cx="190"  cy="310" r="0.6" opacity="0.5"/>
    <circle cx="440"  cy="95"  r="0.8" opacity="0.6"/>
    <circle cx="700"  cy="300" r="0.7" opacity="0.5"/>
    <circle cx="950"  cy="45"  r="0.8" opacity="0.65"/>
    <circle cx="1150" cy="290" r="0.6" opacity="0.48"/>
    <circle cx="1420" cy="85"  r="0.7" opacity="0.58"/>
    <circle cx="1680" cy="310" r="0.6" opacity="0.5"/>
    <circle cx="1880" cy="170" r="0.7" opacity="0.55"/>
    <circle cx="330"  cy="380" r="0.5" opacity="0.42"/>
    <circle cx="820"  cy="360" r="0.6" opacity="0.45"/>
    <circle cx="1080" cy="340" r="0.5" opacity="0.40"/>
    <circle cx="1560" cy="370" r="0.6" opacity="0.44"/>
  </g>

  <!-- ─── CHA OS Logo (merkez) ────────────────────────────── -->
  <g filter="url(#logoGlow)" transform="translate(960, 440)">
    <!-- ASCII logo — SVG text olarak -->
    <text font-family="'DejaVu Sans Mono', 'Courier New', monospace"
          font-size="28" fill="#4a9eff" text-anchor="middle"
          letter-spacing="1" opacity="0.85">
      <tspan x="0" dy="-105">   ██████╗██╗  ██╗ █████╗      ██████╗ ███████╗</tspan>
      <tspan x="0" dy="34">  ██╔════╝██║  ██║██╔══██╗    ██╔═══██╗██╔════╝</tspan>
      <tspan x="0" dy="34">  ██║     ███████║███████║    ██║   ██║███████╗</tspan>
      <tspan x="0" dy="34">  ██║     ██╔══██║██╔══██║    ██║   ██║╚════██║</tspan>
      <tspan x="0" dy="34">  ╚██████╗██║  ██║██║  ██║    ╚██████╔╝███████║</tspan>
      <tspan x="0" dy="34">   ╚═════╝╚═╝  ╚═╝╚═╝  ╚═╝    ╚═════╝ ╚══════╝</tspan>
    </text>
  </g>

  <!-- Tagline -->
  <text x="960" y="630"
        font-family="'DejaVu Sans', Arial, sans-serif"
        font-size="18" fill="#6090b0"
        text-anchor="middle"
        letter-spacing="8"
        opacity="0.7">MINIMAL · HIZLI · GÜÇLÜ</text>

  <!-- Sürüm etiketi (sol alt) -->
  <text x="36" y="1056"
        font-family="'DejaVu Sans Mono', monospace"
        font-size="13" fill="#2a4060"
        opacity="0.6">CHA OS 1.0.0</text>

  <!-- Web (sağ alt) -->
  <text x="1884" y="1056"
        font-family="'DejaVu Sans Mono', monospace"
        font-size="13" fill="#2a4060"
        text-anchor="end"
        opacity="0.6">chaossmp.qzz.io</text>
</svg>
